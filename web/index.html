<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不动产登记系统 · 排队网络容量评估</title>
<style>
  :root { --bg:#0f1620; --panel:#18222f; --line:#2a3a4d; --txt:#dbe4ee;
          --sub:#8aa0b4; --accent:#4aa8ff; --warn:#ffb454; --bad:#ff6b6b; --ok:#51cf66; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .hint { color:var(--sub); font-size:13px; }
  .layout { display:grid; grid-template-columns:minmax(560px,1.4fr) minmax(340px,1fr);
            gap:16px; padding:16px 24px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:16px; }
  .panel h2 { font-size:14px; margin:0 0 12px; color:var(--accent); font-weight:600; }
  .controls { display:flex; flex-direction:column; gap:14px; margin-bottom:8px; }
  .ctl label { display:flex; justify-content:space-between; font-size:13px;
               color:var(--sub); margin-bottom:6px; }
  .ctl label b { color:var(--txt); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); }
  svg { width:100%; height:380px; }
  .node rect { fill:#1f2d3d; stroke:var(--line); stroke-width:1.5; }
  .node.bottleneck rect { stroke:var(--bad); stroke-width:2.5; }
  .node.pool rect { fill:#2a2418; stroke:#5a4a2a; }
  .node.pool.bottleneck rect { stroke:var(--warn); stroke-width:2.5; }
  .node text { fill:var(--txt); font-size:12px; text-anchor:middle; }
  .node .util { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .node .disc { fill:var(--sub); font-size:10px; }
  .edge { stroke:var(--line); stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--line);
          font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--sub); font-weight:500; }
  .bar { height:6px; border-radius:3px; background:var(--line); margin-top:4px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .chain { list-style:none; padding:0; margin:0; font-size:13px; }
  .chain li { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
              margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
  .chain .ord { color:var(--accent); font-weight:700; }
  .tag { font-size:11px; padding:1px 7px; border-radius:10px; background:var(--line); color:var(--sub); }
  .tag.pool { background:#3a2f18; color:var(--warn); }
  .muted { color:var(--sub); font-size:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; }
  .pill.ok { background:#14301c; color:var(--ok); }
  .pill.bad { background:#3a1a1a; color:var(--bad); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:1000px){ .layout{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>不动产登记系统 · 排队网络容量评估</h1>
  <span class="hint">解析模型（MVA + 分层 Erlang-C）实时求解 · 拖动滑块观察瓶颈与响应时间</span>
  <span id="stablePill" class="pill ok">稳定</span>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <h2>排队网络拓扑与实时利用率</h2>
      <div class="controls">
        <div class="ctl">
          <label>闭合用户规模倍数 <b id="popVal">1.00×</b></label>
          <input id="pop" type="range" min="0.3" max="2.4" step="0.05" value="1">
        </div>
        <div class="ctl">
          <label>开放到达率倍数（第三方推送） <b id="arrVal">1.00×</b></label>
          <input id="arr" type="range" min="0.3" max="2.8" step="0.05" value="1">
        </div>
        <div class="toggle">
          <input id="burst" type="checkbox">
          <label for="burst" style="margin:0">强突发修正（到达变异 ca²=4，模拟税期高峰）</label>
        </div>
      </div>
      <svg id="net" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet">
        <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
          orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a3a4d"/></marker></defs>
        <g id="edges"></g><g id="nodes"></g>
      </svg>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:16px">
      <h2>各类请求响应时间 / 吞吐</h2>
      <table id="classTable"><thead><tr>
        <th>请求类</th><th>响应时间(s)</th><th>吞吐(/s)</th><th>负载</th>
      </tr></thead><tbody></tbody></table>
      <h2 style="margin-top:18px">站点与资源池利用率</h2>
      <table id="utilTable"><thead><tr>
        <th>资源</th><th>利用率</th><th>排队/等待</th><th style="width:120px">占用</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<div class="layout" style="padding-top:0">
  <div class="panel">
    <h2>用户数翻倍 What-if</h2>
    <table id="doubleTable"><thead><tr>
      <th>请求类</th><th>当前 RT(s)</th><th>翻倍后 RT(s)</th><th>变化倍数</th>
    </tr></thead><tbody></tbody></table>
    <p class="muted" id="doubleBn"></p>
  </div>
  <div class="panel">
    <h2>瓶颈转移链（逐个解除）</h2>
    <ol class="chain" id="chain"></ol>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DISC = {FCFS:"先到先服务", PS:"处理器共享", IS:"纯延迟"};
let timer = null;

function utilColor(u, isDelay){
  if (isDelay) return "#4aa8ff";
  if (u >= 0.9) return "var(--bad)";
  if (u >= 0.7) return "var(--warn)";
  return "var(--ok)";
}
function pct(u){ return (u*100).toFixed(1)+"%"; }

async function refresh(){
  const pop = $("pop").value, arr = $("arr").value, cv = $("burst").checked ? 4 : 1;
  $("popVal").textContent = (+pop).toFixed(2)+"×";
  $("arrVal").textContent = (+arr).toFixed(2)+"×";
  const r = await fetch(`/api/state?pop=${pop}&arr=${arr}&cv=${cv}`);
  const d = await r.json();
  if (d.error){ alert("计算失败: "+d.error); return; }
  renderTopology(d);
  renderTables(d);
  renderDouble(d);
  renderChain(d);
  const pill = $("stablePill");
  pill.textContent = d.stable ? "系统稳定" : "过载风险";
  pill.className = "pill " + (d.stable ? "ok" : "bad");
}

function renderTopology(d){
  const topo = d.topology, pos = topo.positions;
  $("edges").innerHTML = topo.edges.map(e=>{
    const [x1,y1]=pos[e.from], [x2,y2]=pos[e.to];
    return `<path class="edge" d="M${x1+60},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2-60},${y2}"/>`;
  }).join("");
  const allNodes = [
    ...d.stations.map(s=>({...s, pool:false})),
    ...d.pools.map(p=>({name:p.name, util:p.util, discipline:"POOL",
                        servers:p.capacity, pool:true, is_delay:false,
                        queue:p.queue}))
  ];
  $("nodes").innerHTML = allNodes.map(n=>{
    const [x,y] = pos[n.name] || [0,0];
    const bn = n.name === d.bottleneck ? "bottleneck" : "";
    const label = n.pool ? "资源池" : DISC[n.discipline];
    const sub = n.pool ? `${n.servers} 令牌` :
          (n.discipline==="IS" ? "无限台" : `${n.servers} 台`);
    return `<g class="node ${n.pool?'pool':''} ${bn}" transform="translate(${x-65},${y-34})">
      <rect width="130" height="68" rx="9"/>
      <text x="65" y="18">${n.name}</text>
      <text class="util" x="65" y="38" fill="${utilColor(n.util,n.is_delay)}">${pct(n.util)}</text>
      <text class="disc" x="65" y="55">${label} · ${sub}</text></g>`;
  }).join("");
}

function renderTables(d){
  $("classTable").querySelector("tbody").innerHTML = d.classes.map(c=>`
    <tr><td>${c.name}<br><span class="muted">${c.kind==="closed"
        ? c.population+" 用户" : c.arrival.toFixed(1)+"/s 到达"}</span></td>
    <td>${c.rt.toFixed(3)}</td><td>${c.x.toFixed(2)}</td>
    <td>${c.kind==="closed" ? "闭合" : "开放"}</td></tr>`).join("");
  const rows = [
    ...d.stations.map(s=>({name:s.name, util:s.util,
        extra:`队长 ${s.queue.toFixed(2)}`, tag:DISC[s.discipline], pool:false,
        isDelay:s.is_delay})),
    ...d.pools.map(p=>({name:p.name, util:p.util,
        extra:`等待 ${p.wait.toFixed(3)}s`, tag:"资源池", pool:true, isDelay:false}))
  ];
  $("utilTable").querySelector("tbody").innerHTML = rows.map(r=>`
    <tr><td>${r.name} <span class="tag ${r.pool?'pool':''}">${r.tag}</span></td>
    <td>${pct(r.util)}</td><td class="muted">${r.extra}</td>
    <td><div class="bar"><i style="width:${Math.min(100,r.util*100)}%;
        background:${utilColor(r.util,r.isDelay)}"></i></div></td></tr>`).join("");
}

function renderDouble(d){
  const cur = Object.fromEntries(d.classes.map(c=>[c.name,c.rt]));
  $("doubleTable").querySelector("tbody").innerHTML = d.double.classes.map(c=>`
    <tr><td>${c.name}</td><td>${cur[c.name].toFixed(3)}</td>
    <td>${c.rt.toFixed(3)}</td>
    <td style="color:${c.ratio>=2?'var(--bad)':c.ratio>=1.5?'var(--warn)':'var(--ok)'}">
    ${c.ratio.toFixed(2)}×</td></tr>`).join("");
  $("doubleBn").textContent = `翻倍后首要瓶颈：${d.double.bottleneck}` +
    (d.double.stable ? "" : "（系统将过载）");
}

function renderChain(d){
  $("chain").innerHTML = d.chain.map(s=>`
    <li><span><span class="ord">${s.order}.</span> ${s.name}
      <span class="tag ${s.kind==='pool'?'pool':''}">${s.kind==='pool'?'资源池':'站点'}</span></span>
      <span class="muted">${pct(s.util)} · ${s.action}</span></li>`).join("")
    || '<li class="muted">当前负载下无明显瓶颈</li>';
}

["pop","arr"].forEach(id=>$(id).addEventListener("input",()=>{
  clearTimeout(timer); timer=setTimeout(refresh,120);
}));
$("burst").addEventListener("change",refresh);
refresh();
</script>
</body>
</html>
